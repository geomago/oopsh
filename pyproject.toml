[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oopsh"
version = "1.0.0.dev0"
description = "Corrects your previous console command. A maintained fork of thefuck."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Vladimir Iakovlev", email = "nvbn.rm@gmail.com" }]
maintainers = [{ name = "Giorgio Di Falco" }]
keywords = ["shell", "command-line", "typo", "thefuck", "thefuck alternative", "maintained fork"]
requires-python = ">=3.10"
dependencies = ["colorama", "decorator", "psutil", "pyte"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/geomago/oopsh"
Issues = "https://github.com/geomago/oopsh/issues"

[project.scripts]
oopsh = "oopsh.entrypoints.main:main"
oops = "oopsh.entrypoints.not_configured:main"

[dependency-groups]
test = [
    "pexpect",
    "pytest",
    "pytest-benchmark",
    "pytest-docker-pexpect",
    "pytest-mock",
]
lint = ["flake8"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.setuptools.packages.find]
include = ["oopsh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
